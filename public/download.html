<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mayajaall</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
            color: white;
        }
        .container {
            background: rgba(255,255,255,0.1);
            backdrop-filter: blur(10px);
            padding: 40px 30px;
            border-radius: 24px;
            max-width: 400px;
            width: 100%;
            text-align: center;
            box-shadow: 0 8px 32px rgba(0,0,0,0.2);
        }
        .logo { font-size: 60px; margin-bottom: 10px; }
        h1 { font-size: 32px; margin-bottom: 8px; }
        p { font-size: 16px; opacity: 0.9; margin-bottom: 30px; }
        .btn {
            display: block;
            padding: 18px 30px;
            border-radius: 14px;
            text-decoration: none;
            font-size: 18px;
            font-weight: bold;
            margin: 15px 0;
            transition: transform 0.2s, box-shadow 0.2s;
            color: white;
            border: none;
            cursor: pointer;
            width: 100%;
        }
        .btn:hover { transform: scale(1.03); box-shadow: 0 6px 20px rgba(0,0,0,0.3); }
        .btn-open { background: #9c27b0; }
        .btn-download { background: #4CAF50; }
        .footer { margin-top: 25px; font-size: 13px; opacity: 0.7; }
    </style>
</head>
<body>
    <div class="container">
        <div class="logo">🎬</div>
        <h1>Mayajaall</h1>
        <p>Video dekhne ke liye app kholo ya download karo</p>
        
        <button onclick="openApp()" class="btn btn-open">
            📱 Open in App
        </button>
        
        <a href="https://github.com/ajayr0201/Mayajaall/releases/latest/download/app-release.apk" class="btn btn-download">
            📥 Download App (Direct APK)
        </a>
        
        <div class="footer">
            Fast & Secure Video Streaming
        </div>
    </div>

    <script>
        function openApp() {
            // Current URL se video code nikaalo
            var urlParams = new URLSearchParams(window.location.search);
            var videoCode = urlParams.get('code') || 'wpaf82';
            var appUrl = 'mayajaall://open?url=https://live-score-website-alpha.vercel.app/f/' + videoCode;
            
            // App kholne ki koshish karo
            window.location.href = appUrl;
        }
    </script>
</body>
</html>
